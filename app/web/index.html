<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MovieBox OS Demo</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">M</div>
          <div>
            <strong>MovieBox</strong>
            <small>OS</small>
          </div>
        </div>

        <nav>
          <button class="nav active">Overview</button>
          <button class="nav">Library</button>
          <button class="nav">Discover</button>
          <button class="nav">Downloads</button>
          <button class="nav">Users</button>
          <button class="nav">Settings</button>
        </nav>

        <div class="sidebar-card">
          <p>Platform status</p>
          <span class="status online">Online</span>
          <small>12 services healthy</small>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <p class="eyebrow">Dashboard</p>
            <h1>Media command center</h1>
          </div>

          <div class="header-actions">
            <form id="loginForm" class="login-form">
              <input id="emailInput" type="email" value="admin@moviebox.io" aria-label="Email" />
              <input id="passwordInput" type="password" value="demo123" aria-label="Password" />
              <button type="submit" class="primary small">Login</button>
            </form>
          </div>
        </header>

        <div id="authStatus" class="auth-status"></div>

        <section class="stats" id="statsGrid"></section>

        <section class="content-grid">
          <div class="panel wide">
            <div class="panel-header">
              <h2>Recent media activity</h2>
              <button class="ghost small">View all</button>
            </div>
            <div class="activity-list" id="activityList"></div>
          </div>

          <div class="panel">
            <div class="panel-header">
              <h2>Usage by type</h2>
            </div>
            <div class="donut-wrap">
              <div class="donut-chart">
                <div class="donut-center">
                  <strong>73%</strong>
                  <span>streaming</span>
                </div>
              </div>
              <ul class="legend">
                <li><span class="dot purple"></span> Movies</li>
                <li><span class="dot blue"></span> Series</li>
                <li><span class="dot green"></span> Live TV</li>
              </ul>
            </div>
          </div>
        </section>

        <section class="panel lower">
          <div class="panel-header">
            <h2>Library search</h2>
            <div class="filters">
              <button class="filter-btn active" data-category="all">All</button>
              <button class="filter-btn" data-category="movie">Movies</button>
              <button class="filter-btn" data-category="series">Series</button>
              <button class="filter-btn" data-category="live">Live</button>
              <button class="filter-btn" data-category="documentary">Docs</button>
            </div>
            <input id="searchInput" type="text" placeholder="Search titles, genre, or type" />
          </div>

          <div class="library-grid" id="libraryGrid"></div>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
